<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arch TOGAF</title>
<style>
  :root {
    --ui-bg: #ffffff;
    --ui-bg2: #f3f4f6;
    --ui-border: #e2e5ea;
    --ui-text: #1f2937;
    --ui-muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, .12);
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ui-text); background: var(--ui-bg); display: flex; flex-direction: column; overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- toolbar ---------- */
  #toolbar {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--ui-border);
    background: var(--ui-bg); flex-wrap: wrap; min-height: 46px; z-index: 5;
  }
  .brand { font-weight: 700; margin-right: 8px; white-space: nowrap; }
  .brand small { font-weight: 400; color: var(--ui-muted); margin-left: 4px; }
  .tgroup { display: flex; gap: 2px; padding: 0 6px; border-left: 1px solid var(--ui-border); align-items: center; }
  .tbtn {
    border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .tbtn:hover { background: var(--ui-bg2); border-color: var(--ui-border); }
  .tbtn svg { width: 16px; height: 16px; }
  .tbtn:disabled { opacity: .4; cursor: default; }
  #zoomLabel { min-width: 46px; text-align: center; color: var(--ui-muted); cursor: pointer; }
  #fileName { margin-left: auto; color: var(--ui-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
  #toolbar a.tbtn { color: inherit; text-decoration: none; }

  /* ---------- main ---------- */
  main { flex: 1; display: flex; min-height: 0; }
  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage { position: relative; flex: 1; overflow: hidden; outline: none; }

  /* view tabs above the canvas */
  #viewTabs { display: flex; align-items: flex-end; gap: 2px; padding: 5px 8px 0; background: var(--ui-bg2); border-bottom: 1px solid var(--ui-border); overflow-x: auto; overflow-y: hidden; flex: none; scrollbar-width: none; }
  #viewTabs .vtab { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; border-bottom: 0; background: transparent; border-radius: 7px 7px 0 0; padding: 5px 10px; cursor: pointer; white-space: nowrap; max-width: 220px; color: #4b5563; }
  #viewTabs .vtab:hover { background: rgba(255,255,255,.6); }
  #viewTabs .vtab.on { background: var(--ui-bg); border-color: var(--ui-border); color: var(--ui-text); margin-bottom: -1px; padding-bottom: 6px; }
  #viewTabs .vtab .nm { overflow: hidden; text-overflow: ellipsis; }
  #viewTabs .vtab .ph { font-size: 10px; font-weight: 700; color: #fff; background: #64748b; border-radius: 4px; padding: 0 4px; }
  #viewTabs .vadd { border: 0; background: transparent; cursor: pointer; padding: 4px 9px; border-radius: 6px; font-size: 15px; color: var(--ui-muted); }
  #viewTabs .vadd:hover { background: rgba(255,255,255,.7); color: var(--ui-text); }
  #viewTabs input { border: 1px solid var(--accent); border-radius: 5px; padding: 1px 4px; width: 150px; }

  /* left panel: palette, model browser, ADM */
  #left { width: 252px; flex: none; border-right: 1px solid var(--ui-border); background: var(--ui-bg); display: flex; flex-direction: column; min-height: 0; }
  #leftTabs { display: flex; gap: 2px; margin: 8px 10px 0; padding: 2px; background: var(--ui-bg2); border-radius: 8px; flex: none; }
  #leftTabs button { flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 5px 0; cursor: pointer; color: #4b5563; }
  #leftTabs button.on { background: var(--ui-bg); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  #left .panel { padding: 8px 10px 40px; }
  .pal-layer { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ui-muted); display: flex; align-items: center; gap: 6px; }
  .pal-layer i { width: 10px; height: 10px; border-radius: 3px; border: 1px solid rgba(0,0,0,.2); }
  .pal-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
  .pal-item { height: 32px; border: 1px solid rgba(0,0,0,.14); border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; color: #1f2937; }
  .pal-item:hover { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .pal-item.cur { box-shadow: inset 0 0 0 2px var(--accent); }
  .pal-item svg { width: 18px; height: 18px; }
  .pal-note { font-size: 12px; color: var(--ui-muted); margin: 6px 0; }
  .search { width: 100%; padding: 5px 8px; border: 1px solid var(--ui-border); border-radius: 7px; background: var(--ui-bg); margin: 2px 0 6px; }
  .tree-h { display: flex; align-items: center; gap: 6px; margin: 8px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ui-muted); cursor: pointer; user-select: none; }
  .tree-h .cnt { margin-left: auto; text-transform: none; }
  .tree-h i { width: 10px; height: 10px; border-radius: 3px; border: 1px solid rgba(0,0,0,.2); }
  .tree-i { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  .tree-i:hover { background: var(--ui-bg2); }
  .tree-i.on { background: var(--accent-soft); }
  .tree-i svg { width: 15px; height: 15px; flex: none; color: #374151; }
  .tree-i .rico svg { width: 30px; height: 12px; }
  .tree-i .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-i .nm.unused { font-style: italic; color: var(--ui-muted); }
  .tree-i .uses { font-size: 11px; color: var(--ui-muted); }
  .adm-wheel { display: block; margin: 4px auto 0; width: 100%; max-width: 240px; height: auto; }
  .adm-wheel .ph { cursor: pointer; }
  .adm-wheel .ph:hover circle { stroke: var(--accent); stroke-width: 2.5; }
  .adm-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--ui-muted); margin: 2px 0 6px; justify-content: center; }
  .adm-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
  .chk-list label { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; margin: 3px 0; cursor: pointer; }
  .chk-list label input { margin-top: 2px; }
  .chk-list label.done span { color: var(--ui-muted); text-decoration: line-through; }
  .chk-list .grp { font-size: 11px; color: var(--ui-muted); margin: 8px 0 2px; font-weight: 600; }
  .vlink { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 1px solid var(--ui-border); background: var(--ui-bg); border-radius: 7px; padding: 5px 8px; margin: 4px 0; cursor: pointer; font-size: 12px; }
  .vlink:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rel-item { display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 4px; border-radius: 6px; cursor: pointer; }
  .rel-item:hover { background: var(--ui-bg2); }
  .rel-item .rt { color: var(--ui-muted); white-space: nowrap; }
  .rel-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .typetag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px 2px 4px; border-radius: 6px; border: 1px solid rgba(0,0,0,.14); }
  .typetag svg { width: 15px; height: 15px; }
  .prop-row { display: grid; grid-template-columns: 1fr 1.3fr auto; gap: 4px; margin: 3px 0; }
  .prop-row input { min-width: 0; padding: 3px 6px; border: 1px solid var(--ui-border); border-radius: 6px; background: var(--ui-bg); }
  .prop-row button { border: 0; background: transparent; color: var(--ui-muted); cursor: pointer; }
  .warn { font-size: 12px; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 7px; padding: 5px 8px; margin: 6px 0; }

  /* relationship picker */
  #relPicker { position: absolute; z-index: 8; background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 5px; min-width: 210px; }
  #relPicker .rp-h { font-size: 11px; color: var(--ui-muted); padding: 3px 7px 5px; }
  #relPicker button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 5px 7px; border-radius: 6px; cursor: pointer; text-align: left; }
  #relPicker button:hover, #relPicker button.def { background: var(--accent-soft); }
  #relPicker button.bad { color: var(--ui-muted); }
  #relPicker .sep { height: 1px; background: var(--ui-border); margin: 4px 0; }

  /* catalogs dialog */
  #catDlg { width: min(1200px, calc(100vw - 32px)); }
  #catDlg .dlg-body { max-height: 72vh; }
  .cat-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--ui-border); }
  .cat-bar select, .cat-bar input { padding: 4px 6px; border: 1px solid var(--ui-border); border-radius: 6px; background: var(--ui-bg); }
  table.cat { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.cat th, table.cat td { border-bottom: 1px solid var(--ui-bg2); padding: 5px 7px; text-align: left; vertical-align: top; }
  table.cat th { position: sticky; top: 0; background: var(--ui-bg); color: var(--ui-muted); font-weight: 600; z-index: 1; }
  table.cat tr.click:hover td { background: var(--accent-soft); cursor: pointer; }
  table.cat.mx { width: auto; }
  table.mx th.rot { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; vertical-align: bottom; max-height: 160px; }
  table.mx td.c { text-align: center; color: #1f2937; border-left: 1px solid var(--ui-bg2); }
  table.mx td.c.on { background: #eef2ff; font-weight: 600; }
  #svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
  #svg .block { cursor: move; }
  #svg.shift .block, #svg.shift .conn { cursor: crosshair; }
  #svg .link .hit { cursor: pointer; }
  #svg .seg-h { cursor: ns-resize !important; } #svg .seg-v { cursor: ew-resize !important; }
  #svg .conn, #svg .end-handle { cursor: grab; }
  #svg { cursor: grab; }
  #stage.panning #svg, #stage.panning #svg * { cursor: grab !important; }
  #stage.dragpan #svg, #stage.dragpan #svg * { cursor: grabbing !important; }
  .h-nw, .h-se { cursor: nwse-resize; } .h-ne, .h-sw { cursor: nesw-resize; }
  .h-n, .h-s { cursor: ns-resize; } .h-e, .h-w { cursor: ew-resize; }

  /* block content inside foreignObject */
  .bc {
    width: 100%; height: 100%; padding: 6px 10px; display: flex; gap: 8px; overflow: hidden; position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.25; word-break: break-word; pointer-events: none; user-select: none; box-sizing: border-box;
  }
  .bc .bt { min-width: 0; }
  .bc .bi { flex: none; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .bc .bi-corner { position: absolute; left: 6px; top: 6px; }
  .bc .bi-tr { position: absolute; right: 5px; top: 4px; opacity: .85; }
  .bc.el { padding: 6px 22px; }
  .bc .ty { font-size: .75em; opacity: .65; font-style: italic; }
  .bc p { margin: 0; }

  /* rich text editor overlay */
  #edWrap {
    position: absolute; transform-origin: 0 0; display: flex; padding: 6px 10px; overflow: hidden;
    background: rgba(255,255,255,.85); outline: 2px solid var(--accent); z-index: 4;
  }
  #edInner {
    outline: none; min-width: 20px; max-width: 100%; max-height: 100%; overflow: auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.25; word-break: break-word;
  }
  #edInner p { margin: 0; }
  #edBar {
    position: absolute; z-index: 6; display: flex; gap: 2px; align-items: center; padding: 3px; background: var(--ui-bg);
    border: 1px solid var(--ui-border); border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  }
  #edBar button { border: 0; background: transparent; border-radius: 5px; min-width: 26px; height: 26px; cursor: pointer; }
  #edBar button:hover { background: var(--ui-bg2); }
  #edBar select { height: 26px; border: 1px solid var(--ui-border); border-radius: 5px; background: var(--ui-bg); }
  #edBar input[type=color] { margin: 0 3px; }
  #edBar.plain > :not([data-ed=done]) { display: none; }
  #edBar .sep { width: 1px; height: 18px; background: var(--ui-border); margin: 0 3px; }

  #hint {
    position: absolute; left: 10px; bottom: 8px; color: var(--ui-muted); font-size: 12px; pointer-events: none;
    background: rgba(255,255,255,.75); padding: 2px 8px; border-radius: 6px;
  }
  #toast {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: #111827; color: #fff; padding: 6px 12px;
    border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10;
  }
  #toast.show { opacity: .92; }

  /* ---------- inspector ---------- */
  #side { width: 290px; flex: none; border-left: 1px solid var(--ui-border); background: var(--ui-bg); display: flex; flex-direction: column; min-height: 0; }
  #sideTabs { display: flex; gap: 2px; margin: 8px 12px 0; padding: 2px; background: var(--ui-bg2); border-radius: 8px; flex: none; }
  #sideTabs button { flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 5px 0; cursor: pointer; color: #4b5563; }
  #sideTabs button.on { background: var(--ui-bg); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  #sideTabs .cnt { font-size: 11px; color: var(--ui-muted); margin-left: 2px; }
  .panel { flex: 1; overflow-y: auto; padding: 10px 12px 40px; min-height: 0; }
  .panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ui-muted); margin: 14px 0 6px; }
  .panel h3:first-child { margin-top: 2px; }
  .row { display: grid; grid-template-columns: 96px 1fr; gap: 6px; align-items: center; margin: 4px 0; }
  .row > span { color: var(--ui-muted); font-size: 12px; }
  .row input[type=text], .row input[type=number], .row select, .row textarea {
    width: 100%; padding: 4px 6px; border: 1px solid var(--ui-border); border-radius: 6px; background: var(--ui-bg); min-width: 0;
  }
  .color { display: inline-flex; align-items: center; gap: 8px; justify-self: start; cursor: pointer; }
  .color input[type=color], #edBar input[type=color] {
    -webkit-appearance: none; appearance: none; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px;
    background: none; cursor: pointer; box-shadow: 0 0 0 1px rgba(0,0,0,.14), 0 1px 2px rgba(0,0,0,.08); flex: none;
  }
  .color input[type=color]::-webkit-color-swatch-wrapper, #edBar input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .color input[type=color]::-webkit-color-swatch, #edBar input[type=color]::-webkit-color-swatch { border: 0; border-radius: 6px; }
  .color input[type=color]::-moz-color-swatch, #edBar input[type=color]::-moz-color-swatch { border: 0; border-radius: 6px; }
  .color input[type=color]:hover, #edBar input[type=color]:hover { box-shadow: 0 0 0 1px rgba(0,0,0,.14), 0 0 0 3px var(--accent-soft); }
  .color .hex { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ui-muted); text-transform: uppercase; }
  .row input[type=checkbox] { justify-self: start; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .btn {
    border: 1px solid var(--ui-border); background: var(--ui-bg); border-radius: 6px; padding: 4px 9px; cursor: pointer;
  }
  .btn:hover { background: var(--ui-bg2); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--ui-bg2); border-radius: 8px; justify-self: start; }
  .seg button {
    border: 0; background: transparent; border-radius: 6px; height: 26px; min-width: 30px; padding: 0 5px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; color: #4b5563;
  }
  .seg button:hover { background: rgba(255,255,255,.7); color: var(--ui-text); }
  .seg button.on { background: var(--ui-bg); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04); }
  .seg.grid { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; }
  .seg.grid button { min-width: 0; padding: 0; }
  .row.stack { grid-template-columns: 1fr; gap: 3px; }
  .conn-item { border: 1px solid var(--ui-border); border-radius: 8px; padding: 6px 8px; margin: 5px 0; }
  .conn-item:hover { border-color: var(--accent); background: var(--accent-soft); }
  .conn-head { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font-size: 12px; }
  .conn-dir { color: var(--accent); font-weight: 700; }
  .conn-other { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn-head select { border: 1px solid var(--ui-border); border-radius: 6px; background: var(--ui-bg); padding: 1px 4px; font-size: 12px; max-width: 110px; }
  .conn-ctl { display: flex; align-items: center; gap: 8px; }
  .conn-ctl input[type=text] { flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid var(--ui-border); border-radius: 6px; background: var(--ui-bg); }
  .conn-ctl .chk { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--ui-muted); cursor: pointer; }
  .icon-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 4px 0 6px; }
  .icon-grid button {
    border: 1px solid var(--ui-border); background: var(--ui-bg); border-radius: 5px; height: 30px; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center; color: #374151;
  }
  .icon-grid button.on { border-color: var(--accent); background: var(--accent-soft); }
  .icon-grid svg { width: 18px; height: 18px; }
  .muted { color: var(--ui-muted); }
  .kbd { font-family: ui-monospace, Menlo, monospace; font-size: 11px; background: var(--ui-bg2); border: 1px solid var(--ui-border); border-radius: 4px; padding: 0 4px; }
  ul.tips { padding-left: 16px; margin: 6px 0; color: var(--ui-muted); }
  .flow-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid var(--ui-border); background: var(--ui-bg); border-radius: 8px; padding: 7px 9px; margin: 5px 0; cursor: pointer; }
  .flow-item:hover { border-color: var(--accent); background: var(--accent-soft); }
  .flow-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .flow-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .flow-item .muted { font-size: 12px; }
  .step { display: flex; align-items: flex-start; gap: 6px; border: 1px solid var(--ui-border); border-radius: 8px; padding: 6px 6px 6px 4px; margin: 5px 0; background: var(--ui-bg); }
  .step:hover, .step.hl { border-color: var(--accent); }
  .step.sel { background: var(--accent-soft); }
  .step.drop-before { box-shadow: 0 -3px 0 var(--accent); } .step.drop-after { box-shadow: 0 3px 0 var(--accent); }
  .step.dragging { opacity: .4; }
  .step-grip { cursor: grab; color: var(--ui-muted); padding: 2px 1px; user-select: none; line-height: 18px; letter-spacing: -2px; }
  .step-num { flex: none; min-width: 20px; height: 20px; border-radius: 10px; color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; }
  .step-body { flex: 1; min-width: 0; }
  .step-el { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 20px; cursor: pointer; }
  .step-body textarea { width: 100%; margin-top: 3px; padding: 3px 6px; border: 1px solid var(--ui-border); border-radius: 6px; background: var(--ui-bg); font: inherit; font-size: 12px; resize: vertical; min-height: 26px; }
  .step-del { border: 0; background: transparent; color: var(--ui-muted); cursor: pointer; border-radius: 5px; padding: 1px 5px; line-height: 18px; }
  .step-del:hover { color: var(--danger); background: var(--ui-bg2); }
  #recBar {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; z-index: 5;
    background: #111827; color: #fff; padding: 6px 8px 6px 12px; border-radius: 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  #recBar .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: recBlink 1.2s infinite; }
  #recBar button { border: 0; background: #fff; color: #111827; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-weight: 600; }
  @keyframes recBlink { 50% { opacity: .25; } }
  #svg.recording .block, #svg.recording .link .hit { cursor: copy !important; }
  #svg .fstep { cursor: pointer; }
  ul.tips li { margin: 3px 0; }

  /* ---------- dialogs ---------- */

  #settingsBody .seg { justify-self: end; }
  #settingsBody .row.stack { grid-template-columns: 1fr; }
  #settingsBody .row.stack .seg { justify-self: stretch; }

  .dlg-foot { display: flex; gap: 6px; padding: 10px 16px; border-top: 1px solid var(--ui-border); justify-content: flex-end; flex-wrap: wrap; }
  .dlg-body h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ui-muted); }
  table.keys { border-collapse: collapse; width: 100%; }
  table.keys td { padding: 4px 6px; border-bottom: 1px solid var(--ui-bg2); vertical-align: top; }
  table.keys td:first-child { white-space: nowrap; width: 40%; }

  @media (max-width: 1100px) { #left { width: 210px; } .pal-grid { grid-template-columns: repeat(5, 1fr); } }
  @media (max-width: 760px) {
    #side { width: 220px; }
    #left { display: none; }
    .tbtn .lbl { display: none; }
  }
</style>

/* =====================================================================

/* Resolve every link end to a point (+ side normal when attached).

function computeEnds() {
  const ends = new Map();

    if (e.block && bmap.has(e.block)) {

      return center(b);

      const b = e.block && bmap.get(e.block);
      if (!b) { r[which] = { x: r2(e.x ?? 0), y: r2(e.y ?? 0), block: null }; continue; }

      let side = fixed ? e.side : null;

    arr.sort((p, q) => p.order - q.order || p.seq - q.seq);
    arr.forEach((r, i) => { r.t = (i + 1) / (arr.length + 1); });
  }
  for (const r of ends.values()) {
    for (const w of ['from', 'to']) {
      const e = r[w];
      if (!e.block) continue;
      const p = sidePoint(e.block, e.side, e.t);
      e.x = r2(p.x); e.y = r2(p.y);

/* Paste like Archi: an element not yet in this view is pasted as a reference to the

function pasteClipboard(offset = 20) {
  if (!clipboard) return;
  const snap = snapshot();
  const map = new Map(), elMap = new Map();
  const cbEl = new Map(clipboard.elements.map(e => [e.id, e])), cbRel = new Map(clipboard.rels.map(r => [r.id, r]));
  const resolveEl = id => {
    if (elMap.has(id)) return elMap.get(id);
    let el = elById(id);
    if (!el || doc.blocks.some(b => b.element === id)) {
      const src = el || cbEl.get(id);
      el = Object.assign(clone(src), { id: uid('e'), name: src.name + (elById(id) ? ' (copy)' : '') });
      model.elements.push(el);
    }
    elMap.set(id, el.id);
    return el.id;
  };
  const nb = clipboard.blocks.map(b => {
    const c = clone(b); c.id = uid('b'); map.set(b.id, c.id); c.x += offset; c.y += offset;
    if (c.element) c.element = resolveEl(b.element);
    return c;
  });
  const mapEnd = e => {
    if (e.block) return map.has(e.block) ? Object.assign(clone(e), { block: map.get(e.block) }) : clone(e);
    return { x: e.x + offset, y: e.y + offset };
  };
  const nl = [];
  for (const l of clipboard.links) {
    const c = Object.assign(clone(l), { id: uid('l'), from: mapEnd(l.from), to: mapEnd(l.to) });
    if (c.waypoints) c.waypoints = c.waypoints.map(q => ({ x: q.x + offset, y: q.y + offset }));
    if (c.rel) {
      const fb = nb.find(b => b.id === c.from.block), tb = nb.find(b => b.id === c.to.block);
      const r = relById(l.rel) || cbRel.get(l.rel);
      if (!fb || !tb || !r) continue;
      if (relById(l.rel) && fb.element === r.source && tb.element === r.target && !doc.links.some(x => x.rel === r.id) && !nl.some(x => x.rel === r.id)) c.rel = r.id;
      else {
        const nr = Object.assign(clone(r), { id: uid('r'), source: fb.element, target: tb.element });
        model.relationships.push(nr);
        c.rel = nr.id;
      }

    nl.push(c);

  clipboard = Object.assign(clone({ blocks: nb, links: nl }), { elements: clone(nb.filter(b => b.element).map(b => elById(b.element))), rels: clone(nl.filter(l => l.rel).map(l => relById(l.rel))) });

}

  if (b.element) edInner.textContent = el ? el.name : ''; else edInner.innerHTML = b.title;
  edBar.classList.toggle('plain', !!b.element);

  if (!editingId) return;

  const jv = { top: 'flex-start', middle: 'center', bottom: 'flex-end' }[b.valign] || 'center';
  Object.assign(edWrap.style, {
    left: (view.x + b.x * view.k) + 'px', top: (view.y + b.y * view.k) + 'px',
    width: b.w + 'px', height: b.h + 'px', transform: `scale(${view.k})`,
    justifyContent: jh, alignItems: jv, borderRadius: b.radius + 'px'
  });

  const top = view.y + b.y * view.k - 40;
  edBar.style.left = Math.max(4, view.x + b.x * view.k) + 'px';

function commitEditor() {
  if (!editingId) return;

  const id = editingId;
  editingId = null;
  edWrap.hidden = true; edBar.hidden = true;
  const el = b && b.element && elById(b.element);
  if (el) {
    const name = edInner.innerText.replace(/\s+/g, ' ').trim().slice(0, 300);
    if (name !== el.name) { const snap = snapshot(); el.name = name; pushUndo(snap); refreshLeft(); }
  } else if (b && !b.element) {
    let html = sanitizeHtml(edInner.innerHTML);

    case 'delStep': { const snap = snapshot(); f.steps.splice(i, 1); hoverStep = -1; pushUndo(snap); break; }
    case 'delFlow': { const snap = snapshot(); doc.flows = doc.flows.filter(x => x !== f); activeFlow = null; recording = false; pushUndo(snap); break; }
  }
  refreshFlows(); render();
});
flowsPanel.addEventListener('input', e => {
  const el = e.target, k = el.dataset.fk, f = flowById(activeFlow);
  if (!k || !f) return;
  if (!flowSnap) flowSnap = snapshot();
  if (k === 'step') f.steps[+el.dataset.i].description = el.value;
  else f[k] = el.value;
  if (k === 'color') { el.nextElementSibling.textContent = el.value; for (const n of flowsPanel.querySelectorAll('.step-num')) n.style.background = el.value; }
  render();
});
flowsPanel.addEventListener('change', e => {
  if (!e.target.dataset.fk || !flowSnap) return;
  pushUndo(flowSnap); flowSnap = null;
});
flowsPanel.addEventListener('mouseover', e => {
  const st = e.target.closest('.step'), i = st ? +st.dataset.i : -1;
  const fi = e.target.closest('.flow-item'), hf = fi ? fi.dataset.f : null;
  if (i !== hoverStep || hf !== hoverFlow) { hoverStep = i; hoverFlow = hf; render(); }
});
flowsPanel.addEventListener('mouseleave', () => { if (hoverStep >= 0 || hoverFlow) { hoverStep = -1; hoverFlow = null; render(); } });
/* reorder steps by dragging their grip */
let stepDrag = -1;
flowsPanel.addEventListener('pointerdown', e => {
  const g = e.target.closest('.step-grip');
  if (g) g.parentElement.draggable = true;
});
flowsPanel.addEventListener('dragstart', e => {
  const st = e.target.closest && e.target.closest('.step');
  if (!st) return;
  stepDrag = +st.dataset.i;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(stepDrag));
  st.classList.add('dragging');
});
const clearDropMarks = () => flowsPanel.querySelectorAll('.drop-before,.drop-after').forEach(n => n.classList.remove('drop-before', 'drop-after'));
flowsPanel.addEventListener('dragover', e => {
  const st = e.target.closest('.step');
  if (stepDrag < 0 || !st) return;
  e.preventDefault();
  clearDropMarks();
  const r = st.getBoundingClientRect();
  st.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
});
flowsPanel.addEventListener('drop', e => {
  const st = e.target.closest('.step'), f = flowById(activeFlow);
  if (stepDrag < 0 || !st || !f) return;
  e.preventDefault();
  const r = st.getBoundingClientRect();
  let to = +st.dataset.i + (e.clientY < r.top + r.height / 2 ? 0 : 1);
  const from = stepDrag;
  if (to > from) to--;
  if (to !== from) {
    const snap = snapshot();
    const [moved] = f.steps.splice(from, 1);
    f.steps.splice(to, 0, moved);
    pushUndo(snap);
  }
  stepDrag = -1; hoverStep = -1;
  refreshFlows(); render();
});
flowsPanel.addEventListener('dragend', () => {
  stepDrag = -1; clearDropMarks();
  flowsPanel.querySelectorAll('.step').forEach(n => { n.draggable = false; n.classList.remove('dragging'); });
});

/* =====================================================================
   Views: tabs, switching, create / duplicate / delete
   ===================================================================== */
function activateView(id) {
  const v = views.find(x => x.id === id);
  if (!v || v === doc) return;
  if (editingId) commitEditor();
  closeRelPicker();
  viewports.set(doc.id, { ...view });
  doc = v;
  bmap = new Map(doc.blocks.map(b => [b.id, b]));
  sel.clear(); activeFlow = null; recording = false; hoverStep = -1; hoverFlow = null;
  const vp = viewports.get(v.id);
  if (vp) view = { ...vp }; else requestAnimationFrame(fitView);
  refreshAll(); render();
}
function createView(props = {}) {
  const snap = snapshot();
  const v = newView(props);
  views.push(v);
  pushUndo(snap);
  const r = svg.getBoundingClientRect();
  viewports.set(v.id, { x: r.width / 2, y: r.height / 2, k: 1 });
  activateView(v.id);
  return v;
}
function duplicateView() {
  const snap = snapshot();
  const c = clone(doc), map = new Map();
  c.id = uid('v'); c.name = doc.name + ' (copy)';
  for (const b of c.blocks) { const n = uid('b'); map.set(b.id, n); b.id = n; }
  for (const l of c.links) { const n = uid('l'); map.set(l.id, n); l.id = n; for (const w of ['from', 'to']) if (l[w].block) l[w].block = map.get(l[w].block); }
  for (const f of c.flows) { f.id = uid('f'); for (const st of f.steps) st.ref = map.get(st.ref) || st.ref; }
  views.splice(views.indexOf(doc) + 1, 0, c);
  viewports.set(c.id, { ...view });
  pushUndo(snap);
  activateView(c.id);
}
function deleteView(id = doc.id) {
  const v = views.find(x => x.id === id);
  if (!v || views.length < 2) return;
  const snap = snapshot();
  const i = views.indexOf(v);
  if (v === doc) activateView((views[i + 1] || views[i - 1]).id);
  views.splice(i, 1);
  pushUndo(snap);
  refreshAll(); render();
  toast(`View “${v.name}” deleted. The model keeps its elements (Undo restores the view).`);
}
function gotoView(viewId, modelId) { activateView(viewId); if (modelId) selectModel(modelId); }

/* select a model element / relationship (from the tree, the inspector or a catalog) */
function selectModel(id) {
  modelSel = id;
  const b = doc.blocks.find(x => x.element === id), l = doc.links.find(x => x.rel === id);
  sel = new Set(b ? [b.id] : l ? [l.id] : []);
  if (b) ensureVisible(b);
  refreshAll(); render();
}
function ensureVisible(b) {
  const r = svg.getBoundingClientRect();
  const x1 = view.x + b.x * view.k, y1 = view.y + b.y * view.k, x2 = x1 + b.w * view.k, y2 = y1 + b.h * view.k;
  if (x1 >= 0 && y1 >= 0 && x2 <= r.width && y2 <= r.height) return;
  view.x = r.width / 2 - (b.x + b.w / 2) * view.k; view.y = r.height / 2 - (b.y + b.h / 2) * view.k;
}

const viewTabs = $('#viewTabs');
function refreshViewTabs() {
  if (viewTabs.querySelector('input')) return; // a tab is being renamed
  viewTabs.innerHTML = views.map(v => {
    const vp = v.viewpoint !== 'none' ? `\n${VIEWPOINTS[v.viewpoint].name} viewpoint` : '';
    const ph = v.phase ? admPhase(v.phase) : null;
    return `<button class="vtab${v === doc ? ' on' : ''}" data-view="${esc(v.id)}" title="${esc(v.name)}${esc(vp)}${ph ? esc('\nADM: ' + ph.name) : ''}\nDouble-click to rename">` +
      `${ph ? `<span class="ph" style="background:${ADM_STATUS[phaseState(ph.id).status].color === '#e2e8f0' ? '#64748b' : ADM_STATUS[phaseState(ph.id).status].color}">${esc(ph.code)}</span>` : ''}<span class="nm">${esc(v.name || 'Untitled view')}</span></button>`;
  }).join('') + `<button class="vadd" data-act="newView" title="New view">+</button>`;
}
viewTabs.addEventListener('click', e => {
  if (e.target.closest('[data-act=newView]')) { createView(); return; }
  const t = e.target.closest('.vtab');
  if (t && !t.querySelector('input')) activateView(t.dataset.view);
});
viewTabs.addEventListener('dblclick', e => {
  const t = e.target.closest('.vtab'), v = t && views.find(x => x.id === t.dataset.view);
  if (!v) return;
  const nm = t.querySelector('.nm');
  nm.innerHTML = `<input type="text" value="${esc(v.name)}">`;
  const inp = nm.querySelector('input');
  inp.focus(); inp.select();
  let done = false;
  const finish = ok => {
    if (done) return; done = true;
    const name = inp.value.trim();
    inp.remove();
    if (ok && name && name !== v.name) { const snap = snapshot(); v.name = name; pushUndo(snap); }
    refreshAll();
  };
  inp.addEventListener('keydown', ev => { ev.stopPropagation(); if (ev.key === 'Enter') finish(true); if (ev.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
});

let modelQuery = '';
function refreshModelTree() {
  if (!modelPanel.querySelector('#modelTree')) {
    modelPanel.innerHTML = `<input class="search" id="modelSearch" type="search" placeholder="Search the model…"><div id="modelTree"></div>`;
    modelPanel.querySelector('#modelSearch').addEventListener('input', e => { modelQuery = e.target.value; refreshModelTree(); });
  }
  const q = modelQuery.trim().toLowerCase();
  const match = (...t) => !q || t.some(x => String(x || '').toLowerCase().includes(q));
  const usedIn = new Map();
  for (const v of views) for (const b of v.blocks) if (b.element) { if (!usedIn.has(b.element)) usedIn.set(b.element, new Set()); usedIn.get(b.element).add(v.id); }
  let h = '';
  for (const [lk, L] of Object.entries(LAYERS)) {
    const els = model.elements.filter(e => ELEMENT_TYPES[e.type].layer === lk && match(e.name, typeName(e.type), e.documentation))
      .sort((a, b) => a.name.localeCompare(b.name));
    if (!els.length) continue;
    const open = !collapsed.has(lk) || q;
    h += `<div class="tree-h" data-fold="${lk}"><span>${open ? '▾' : '▸'}</span><i style="background:${L.color}"></i>${esc(L.name)}<span class="cnt">${els.length}</span></div>`;
    if (open) h += els.map(e => {
      const n = usedIn.get(e.id)?.size || 0;
      return `<div class="tree-i${modelSel === e.id ? ' on' : ''}" draggable="true" data-id="${esc(e.id)}" title="${esc(typeName(e.type))}: ${n ? 'in ' + n + ' view' + (n > 1 ? 's' : '') : 'not in any view'}. Drag onto the canvas to show it.">` +
        `${typeGlyph(e.type, 15)}<span class="nm${n ? '' : ' unused'}">${esc(e.name || '(unnamed)')}</span>${n ? `<span class="uses">${n}</span>` : ''}</div>`;
    }).join('');
  }
  if (!h) h = `<div class="muted" style="font-size:12px;margin:8px 2px">${q ? 'No element matches.' : 'The model is empty. Add elements from the Palette.'}</div>`;
  const rels = model.relationships.filter(r => match(r.name, REL_TYPES[r.type].name, elById(r.source)?.name, elById(r.target)?.name));
  if (rels.length) {
    const open = !collapsed.has('relations') || q;
    h += `<div class="tree-h" data-fold="relations"><span>${open ? '▾' : '▸'}</span>Relationships<span class="cnt">${rels.length}</span></div>`;
    if (open) h += rels.map(r => `<div class="tree-i${modelSel === r.id ? ' on' : ''}" data-id="${esc(r.id)}" title="${esc(REL_TYPES[r.type].name)}${r.name ? ': ' + esc(r.name) : ''}"><span class="rico">${relIcon(r.type)}</span>` +
      `<span class="nm">${esc(elById(r.source)?.name)} → ${esc(elById(r.target)?.name)}</span></div>`).join('');
  }
  const vs = views.filter(v => match(v.name, v.description));
  if (vs.length) {
    const open = !collapsed.has('views') || q;
    h += `<div class="tree-h" data-fold="views"><span>${open ? '▾' : '▸'}</span>Views<span class="cnt">${vs.length}</span></div>`;
    if (open) h += vs.map(v => `<div class="tree-i${v === doc ? ' on' : ''}" data-view="${esc(v.id)}">${glyphSvg('grouping', 15)}<span class="nm">${esc(v.name)}</span>${v.phase ? `<span class="uses">${esc(admPhase(v.phase).code)}</span>` : ''}</div>`).join('');
  }
  $('#modelTree').innerHTML = h;
}
modelPanel.addEventListener('click', e => {

  if (f) { const k = f.dataset.fold; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k); refreshModelTree(); return; }

stage.addEventListener('dragover', e => {

/* ---------- ADM ---------- */
const phaseState = id => adm.phases[id] || { status: 'none', notes: '', checked: {} };
const ensurePhase = id => (adm.phases[id] = adm.phases[id] || { status: 'none', notes: '', checked: {} });
function admWheelSvg() {
  const cx = 120, cy = 132, R = 86;
  const ring = { A: -90, B: -45, C: 0, D: 45, E: 90, F: 135, G: 180, H: 225 };
  const at = id => ({ x: cx + R * Math.cos(ring[id] * Math.PI / 180), y: cy + R * Math.sin(ring[id] * Math.PI / 180) });
  let s = `<svg class="adm-wheel" width="240" height="252" viewBox="0 0 240 252" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">`;
  s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#cbd5e1" stroke-width="2"/>`;
  for (const id of Object.keys(ring)) { const p = at(id); s += `<line x1="${cx}" y1="${cy}" x2="${f1(p.x)}" y2="${f1(p.y)}" stroke="#e2e8f0" stroke-width="1.5"/>`; }
  // direction of the cycle: small chevrons between phases
  for (const a of Object.values(ring)) {
    const m = (a + 22.5) * Math.PI / 180, x = cx + R * Math.cos(m), y = cy + R * Math.sin(m), rot = a + 22.5 + 90;
    s += `<path d="M-3,-4 L2,0 L-3,4" transform="translate(${f1(x)},${f1(y)}) rotate(${f1(rot)})" fill="none" stroke="#94a3b8" stroke-width="1.6"/>`;
  }
  s += `<line x1="38" y1="36" x2="${f1(at('A').x - 18)}" y2="${f1(at('A').y - 8)}" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  const node = (id, x, y, rad) => {
    const p = admPhase(id), st = ADM_STATUS[phaseState(id).status], on = admSel === id;
    return `<g class="ph" data-phase="${id}"><title>${esc(p.name)}: ${st.name}</title><circle cx="${f1(x)}" cy="${f1(y)}" r="${rad}" fill="${st.color}" stroke="${on ? '#2563eb' : '#ffffff'}" stroke-width="${on ? 3 : 2}"/>` +
      `<text x="${f1(x)}" y="${f1(y + 1)}" text-anchor="middle" dominant-baseline="middle" font-size="${id === 'RM' ? 10.5 : 14}" font-weight="700" fill="${st.text}" pointer-events="none">${id === 'RM' ? 'Req.' : p.code}</text></g>`;
  };
  for (const id of Object.keys(ring)) { const p = at(id); s += node(id, p.x, p.y, 22); }
  s += node('prelim', 28, 26, 18);
  s += node('RM', cx, cy, 30);
  return s + '</svg>';
}
function refreshAdm() {
  const p = admPhase(admSel) || ADM_PHASES[1], st = phaseState(p.id);
  let h = admWheelSvg();
  h += `<div class="adm-legend">${Object.values(ADM_STATUS).map(x => `<span><i style="background:${x.color}"></i>${x.name}</span>`).join('')}</div>`;
  h += `<h3>${p.id === 'prelim' || p.id === 'RM' ? '' : 'Phase ' + p.code + ' · '}${esc(p.name)}</h3>`;
  h += `<div class="muted" style="font-size:12px;margin-bottom:6px">${esc(p.objectives)}</div>`;
  h += row('Status', `<select data-adm="status">${Object.entries(ADM_STATUS).map(([k, x]) => `<option value="${k}"${k === st.status ? ' selected' : ''}>${x.name}</option>`).join('')}</select>`);
  h += `<textarea data-adm="notes" rows="3" class="search" style="resize:vertical" placeholder="Notes, decisions, open points…">${esc(st.notes)}</textarea>`;
  const vs = views.filter(v => v.phase === p.id);
  h += `<h3>Views ${cntSpan(vs.length)}</h3>`;
  h += vs.map(v => `<button class="vlink" data-view="${esc(v.id)}">${v === doc ? '● ' : ''}${esc(v.name)}<span class="muted" style="margin-left:auto;font-size:11px">${esc(VIEWPOINTS[v.viewpoint].name)}</span></button>`).join('');
  h += `<div class="btns"><button class="btn" data-adm-act="newView">+ New view for this phase</button>${doc.phase !== p.id ? `<button class="btn" data-adm-act="assign" title="Set the ADM phase of the current view">Assign current view</button>` : ''}</div>`;
  const all = Object.values(p.items).flat(), done = all.filter(x => st.checked[x]).length;
  h += `<h3>Artifacts &amp; deliverables ${cntSpan(done + '/' + all.length)}</h3><div class="chk-list">`;
  for (const [grp, items] of Object.entries(p.items)) {
    h += `<div class="grp">${esc(grp)}</div>` + items.map(it => `<label class="${st.checked[it] ? 'done' : ''}"><input type="checkbox" data-chk="${esc(it)}"${st.checked[it] ? ' checked' : ''}><span>${esc(it)}</span></label>`).join('');
  }
  admPanel.innerHTML = h + '</div>';
}
let admSnap = null;
admPanel.addEventListener('click', e => {
  const ph = e.target.closest('[data-phase]');
  if (ph) { admSel = ph.dataset.phase; refreshAdm(); return; }
  const v = e.target.closest('[data-view]');
  if (v) { activateView(v.dataset.view); return; }
  const a = e.target.closest('[data-adm-act]'), p = admPhase(admSel);
  if (!a || !p) return;
  if (a.dataset.admAct === 'newView') createView({ name: p.name, phase: p.id, viewpoint: p.vp });
  if (a.dataset.admAct === 'assign') { const snap = snapshot(); doc.phase = p.id; if (doc.viewpoint === 'none' && !doc.blocks.length) doc.viewpoint = p.vp; pushUndo(snap); refreshAll(); }
});
admPanel.addEventListener('input', e => {
  if (e.target.dataset.adm !== 'notes') return;
  if (!admSnap) admSnap = snapshot();
  ensurePhase(admSel).notes = e.target.value;
});
admPanel.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.adm === 'notes') { if (admSnap) pushUndo(admSnap); admSnap = null; return; }
  const snap = snapshot(), st = ensurePhase(admSel);
  if (el.dataset.adm === 'status') st.status = el.value;
  else if (el.dataset.chk) { if (el.checked) st.checked[el.dataset.chk] = true; else delete st.checked[el.dataset.chk]; }
  else return;
  pushUndo(snap);
  refreshAdm(); refreshViewTabs();
});

    for (const b of views[0].blocks) delete b.element;

  model = emptyModel();
  views = [newView({ name: 'Main view' })];
  doc = views[0];
  adm = { phases: {} };
  activeFlow = null; recording = false; modelSel = null;
  settings = loadUserDefaults();
  bmap = new Map();
  if (snap !== snapshot()) { undoStack.push(snap); redoStack = []; }
  sel.clear(); fileHandle = null; fileName = 'untitled.json';
  viewports = new Map();
  const r = svg.getBoundingClientRect();
  view = { x: r.width / 2, y: r.height / 2, k: 1 };
  markDirty(); dirty = false; updateTitle();
  refreshAll(); render();
  toast('New workspace (Undo restores the previous one)');
}
function exportSvg() {
  const saved = sel, savedM = modelSel; sel = new Set(); modelSel = null;
  const wasEditing = editingId;
  if (wasEditing) commitEditor();
  doRender();
  const bb = contentBBox();
  sel = saved; modelSel = savedM;
  if (!bb) { toast('Nothing to export'); render(); return; }
  const pad = 24, x = bb.x - pad, y = bb.y - pad, w = bb.w + pad * 2, h = bb.h + pad * 2;
  const ser = new XMLSerializer();
  const css = `.bc{width:100%;height:100%;padding:6px 10px;display:flex;gap:8px;overflow:hidden;position:relative;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.25;word-break:break-word}.bc .bt{min-width:0}.bc .bi{flex:none;display:flex;align-items:center;justify-content:center;line-height:1}.bc .bi-corner{position:absolute;left:6px;top:6px}.bc .bi-tr{position:absolute;right:5px;top:4px;opacity:.85}.bc.el{padding:6px 22px}.bc .ty{font-size:.75em;opacity:.65;font-style:italic}.bc p{margin:0}`;
  const out = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="${f1(x)} ${f1(y)} ${f1(w)} ${f1(h)}" width="${Math.ceil(w)}" height="${Math.ceil(h)}"><style>${css}</style>` +
    `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" fill="${esc(settings.canvas.background)}"/>` +
    [blockLayer, linkLayer, connLayer, flowLayer].map(n => ser.serializeToString(n)).join('') + '</svg>';
  download(fileName.replace(/\.json$/i, '') + ' - ' + (doc.name || 'view').replace(/[\\/:*?"<>|]+/g, '-') + '.svg', out, 'image/svg+xml');
  render();
}

/* drag & drop a JSON file onto the window */
window.addEventListener('dragover', e => { e.preventDefault(); });
window.addEventListener('drop', async e => {
  e.preventDefault();
  const item = [...(e.dataTransfer.items || [])].find(i => i.kind === 'file');
  if (!item) return;
  let handle = null;
  try { if (item.getAsFileSystemHandle) handle = await item.getAsFileSystemHandle(); } catch (err) { handle = null; }
  const file = handle && handle.getFile ? await handle.getFile() : item.getAsFile();
  if (!file) return;
  try { loadFileObject(JSON.parse(await file.text()), file.name, handle && handle.kind === 'file' ? handle : null); toast('Opened ' + file.name); }
  catch (err) { toast('Could not open: ' + err.message, true); }
});

let toastTimer = null;
function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg; t.style.background = isErr ? '#b91c1c' : '#111827';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =====================================================================
   Toolbar & keyboard
   ===================================================================== */
const COMMANDS = {
  new: newDiagram, open: openFile, save: () => saveFile(false), saveAs: () => saveFile(true), exportSvg,
  addBlock: () => addItemCenter(curType), undo, redo, delete: deleteSelection, catalogs: () => openCatalogs(),
  zoomIn: () => zoomCenter(1.2), zoomOut: () => zoomCenter(1 / 1.2), fit: fitView,
  settings: openSettings, help: openHelp
};
$('#toolbar').addEventListener('click', e => {
  const b = e.target.closest('[data-cmd]');
  if (b && COMMANDS[b.dataset.cmd]) COMMANDS[b.dataset.cmd]();
});
$('#zoomLabel').addEventListener('click', () => zoomCenter(1 / view.k));

const isTyping = e => {
  const t = e.target;
  return t && (t.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName));
};
window.addEventListener('keydown', e => {
  if (e.key === 'Shift') svg.classList.add('shift');
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();
  if (mod && key === 's') { e.preventDefault(); if (editingId) commitEditor(); saveFile(e.shiftKey); return; }
  if (mod && key === 'o') { e.preventDefault(); openFile(); return; }
  if (isTyping(e) || document.querySelector('dialog[open]')) return;
  if (e.key === ' ') { spaceDown = true; stage.classList.add('panning'); e.preventDefault(); return; }
  if (mod && key === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && key === 'y') { e.preventDefault(); redo(); return; }
  if (mod && key === 'c') { if (copySelection()) toast('Copied'); return; }
  if (mod && key === 'x') { if (copySelection()) deleteSelection(); return; }
  if (mod && key === 'v') { e.preventDefault(); pasteClipboard(); return; }
  if (mod && key === 'd') { e.preventDefault(); duplicateSelection(); return; }
  if (mod && key === 'a') { e.preventDefault(); sel = new Set([...doc.blocks.map(b => b.id), ...doc.links.map(l => l.id)]); refreshInspector(); render(); return; }
  if (mod && key === '0') { e.preventDefault(); zoomCenter(1 / view.k); return; }
  if (mod && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); deleteFromModel(selectedModelIds()); return; }
  if (mod) return;
  if (relPick && e.key === 'Escape') { closeRelPicker(); return; }
  if (relPick && e.key === 'Enter') { e.preventDefault(); pickRelation(relPick.def); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
  if (recording && (e.key === 'Escape' || e.key === 'Enter')) { e.preventDefault(); setRecording(false); return; }
  if (e.key === 'Escape') { sel.clear(); refreshInspector(); render(); return; }
  if (e.key === 'Enter' && sel.size === 1) { const b = selBlocks()[0]; if (b) { e.preventDefault(); startEdit(b); } return; }
  const step = e.shiftKey ? settings.canvas.gridSize : 1;
  if (e.key === 'ArrowLeft') { e.preventDefault(); nudgeSelection(-step, 0); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); nudgeSelection(step, 0); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); nudgeSelection(0, -step); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); nudgeSelection(0, step); return; }
  if (e.key === '+' || e.key === '=') { zoomCenter(1.2); return; }
  if (e.key === '-' || e.key === '_') { zoomCenter(1 / 1.2); return; }
  if (key === 'f') { fitView(); return; }
});
window.addEventListener('keyup', e => {
  if (e.key === 'Shift') svg.classList.remove('shift');
  if (e.key === ' ') { spaceDown = false; stage.classList.remove('panning'); }
});
window.addEventListener('blur', () => { spaceDown = false; stage.classList.remove('panning'); svg.classList.remove('shift'); });
window.addEventListener('resize', render);

/* =====================================================================
   Demo diagram & startup
   ===================================================================== */
/* A small example workspace: one change (online ordering) through phases A to D */
function loadDemo() {
  const E = {}, R = {};
  const el = (k, type, name, documentation = '') => { E[k] = newElement(type, { id: 'e-' + k, name, documentation }); };
  const rel = (k, type, s, t, props = {}) => { R[k] = newRelationship(type, E[s].id, E[t].id, Object.assign({ id: 'r-' + k }, props)); };
  // Phase A: motivation
  el('ceo', 'stakeholder', 'CEO'); el('cust', 'stakeholder', 'Customers');
  el('growth', 'driver', 'Online sales growth'); el('cost', 'driver', 'Cost of order handling');
  el('lead', 'assessment', 'Order handling takes 2 days', 'Measured in Q2: manual re-entry of web orders into the ERP.');
  el('fast', 'goal', 'Faster order handling'); el('hour', 'outcome', 'Orders confirmed within 1 hour');
  el('digital', 'principle', 'Digital first', 'Rationale: customers expect self-service.\nImplications: every customer interaction has an online channel.');
  el('self', 'requirement', 'Online self-service ordering');
  rel('a1', 'association', 'ceo', 'cost'); rel('a2', 'association', 'cust', 'growth'); rel('a3', 'association', 'cost', 'lead');
  rel('a4', 'influence', 'lead', 'fast'); rel('a5', 'influence', 'growth', 'fast');
  rel('a6', 'realization', 'hour', 'fast'); rel('a7', 'realization', 'self', 'hour'); rel('a8', 'realization', 'digital', 'fast');
  // Phase B: business
  el('customer', 'businessActor', 'Customer'); el('osvc', 'businessService', 'Order service');
  el('recv', 'businessEvent', 'Order received'); el('handle', 'businessProcess', 'Handle order'); el('ship', 'businessProcess', 'Ship goods');
  el('clerk', 'businessRole', 'Sales clerk'); el('sales', 'businessActor', 'Sales department'); el('order', 'businessObject', 'Order');
  rel('b1', 'serving', 'osvc', 'customer'); rel('b2', 'realization', 'handle', 'osvc'); rel('b3', 'triggering', 'recv', 'handle');
  rel('b4', 'triggering', 'handle', 'ship'); rel('b5', 'assignment', 'clerk', 'handle'); rel('b6', 'assignment', 'sales', 'clerk');
  rel('b7', 'access', 'handle', 'order', { accessType: 'write' });
  // Phase C: applications
  el('entry', 'applicationService', 'Order entry'); el('shop', 'applicationComponent', 'Web shop', 'Customer-facing web application.');
  el('erp', 'applicationComponent', 'ERP'); el('api', 'applicationInterface', 'Order API'); el('record', 'dataObject', 'Order record');
  rel('c1', 'serving', 'entry', 'handle'); rel('c2', 'realization', 'shop', 'entry'); rel('c3', 'flow', 'shop', 'erp', { name: 'orders' });
  rel('c4', 'composition', 'erp', 'api'); rel('c5', 'serving', 'api', 'shop'); rel('c6', 'access', 'erp', 'record', { accessType: 'readwrite' });
  rel('c7', 'realization', 'record', 'order'); rel('c8', 'realization', 'shop', 'self');
  // Phase D: technology
  el('cloud', 'node', 'Cloud platform'); el('k8s', 'systemSoftware', 'Kubernetes'); el('pg', 'systemSoftware', 'PostgreSQL');
  el('jar', 'artifact', 'webshop.jar'); el('hosting', 'technologyService', 'Container hosting');
  rel('d1', 'composition', 'cloud', 'k8s'); rel('d2', 'composition', 'cloud', 'pg'); rel('d3', 'realization', 'k8s', 'hosting');
  rel('d4', 'serving', 'hosting', 'shop'); rel('d5', 'realization', 'jar', 'shop'); rel('d6', 'assignment', 'k8s', 'jar');
  E.shop.properties = [{ key: 'Owner', value: 'E-commerce team' }, { key: 'Lifecycle', value: 'Target' }];
  E.erp.properties = [{ key: 'Owner', value: 'IT operations' }, { key: 'Lifecycle', value: 'Baseline' }];

  model = emptyModel();
  model.name = 'Online ordering (example)';
  model.description = 'Example workspace: move order handling online. One view per ADM phase from A to D.';
  model.elements = Object.values(E); model.relationships = Object.values(R);
  views = [];
  const mkView = (props, items) => {
    const v = newView(props);
    for (const [k, x, y, w, h, extra] of items) v.blocks.push(elementBlock(E[k], x, y, Object.assign(w ? { w, h } : {}, extra)));
    for (const b of v.blocks) addRelatedLinks(v, b);
    views.push(v);
    return v;
  };
  mkView({ name: 'Architecture vision', viewpoint: 'motivation', phase: 'A', description: 'Why the change: stakeholders, drivers, goals and the main requirement.' }, [
    ['ceo', 0, 0], ['cust', 0, 160], ['cost', 240, 0], ['growth', 240, 160], ['lead', 480, 0], ['fast', 480, 160],
    ['hour', 720, 160], ['digital', 720, 320], ['self', 960, 160]]);
  const vb = mkView({ name: 'Order handling', viewpoint: 'business', phase: 'B', description: 'Target business process for handling customer orders.' }, [
    ['customer', 0, 0], ['osvc', 260, 0], ['recv', 0, 180], ['handle', 260, 180], ['ship', 520, 180],
    ['clerk', 260, 360], ['sales', 0, 360], ['order', 520, 360]]);
  const lk = k => vb.links.find(l => l.rel === R[k].id).id, bk = k => vb.blocks.find(b => b.element === E[k].id).id;
  vb.flows.push({ id: 'f-order', name: 'Order to delivery', description: 'From the customer order to shipping.', color: FLOW_COLOR, steps: [
    { ref: bk('recv'), description: 'The customer submits an order online' }, { ref: lk('b3'), description: '' },
    { ref: bk('handle'), description: 'The sales clerk checks and confirms the order' }, { ref: bk('order'), description: 'The order is recorded' },
    { ref: bk('ship'), description: 'Goods are shipped' }] });
  mkView({ name: 'Order system', viewpoint: 'applicationUsage', phase: 'C', description: 'Applications supporting order handling.' }, [

  mkView({ name: 'Hosting', viewpoint: 'technologyUsage', phase: 'D', description: 'Where the web shop runs.' }, [

  adm = { phases: {
    prelim: { status: 'done', notes: '', checked: { 'Architecture Principles': true, 'Request for Architecture Work': true } },
    A: { status: 'done', notes: 'Vision approved by the CEO.', checked: { 'Architecture Vision': true, 'Approved Statement of Architecture Work': true } },
    B: { status: 'progress', notes: '', checked: { 'Process Flow diagram': true } },
    C: { status: 'progress', notes: '', checked: {} }
  } };
  doc = views[0];
  bmap = new Map(doc.blocks.map(b => [b.id, b]));
  viewports = new Map();
  fileName = 'example.json'; fileHandle = null;
  requestAnimationFrame(fitView);
}

function init() {
  $('#verLabel').textContent = 'v' + APP_INFO.version;
  $('#ghLink').href = APP_INFO.github;
  let restored = false;
  try {
    const saved = JSON.parse(storageGet(STORE + 'autosave') || 'null');
    if (saved && saved.data) { loadFileObject(saved.data, saved.fileName, null); undoStack = []; restored = true; }
  } catch (e) { restored = false; }
  if (!restored) loadDemo();
  dirty = false; updateTitle();
  refreshAll(); render();
}
init();
